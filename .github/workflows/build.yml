name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Prepare
        run: |
          unzip -q RareWatch.zip
          mkdir -p RareWatch/app/src/main/assets/tessdata
          curl -L -o RareWatch/app/src/main/assets/tessdata/ara.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata
          sed -i 's#cz.adaptive:tesseract4android:4.7.0#cz.adaptech.tesseract4android:tesseract4android:4.9.0#' RareWatch/app/build.gradle.kts
          sed -i 's#google(); mavenCentral() } }#google(); mavenCentral(); maven("https://jitpack.io") } }#' RareWatch/settings.gradle.kts
          sed -i 's#wm.removeView(pv)#wm.removeView(pv!!)#' RareWatch/app/src/main/java/com/rarewatch/app/WatchService.kt
      - name: Build
        working-directory: RareWatch
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RareWatch-apk
          path: RareWatch/app/build/outputs/apk/debug/app-debug.apk
